name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the manifest and its files
        run: node .github/check-plugin.mjs
      - name: Fetch the English source for this pack version
        run: node tools/fetch-upstream.mjs "$(node -p "require('./orca-plugin.json').version")"
      - name: Check the pack against that release
        run: node tools/quality.mjs
